---
layout: default
---
<article class="card content-card post" aria-labelledby="page-title">
  <p class="post-back"><a href="{{ '/blog/' | relative_url }}">← All posts</a></p>
  <h1 id="page-title" class="page-title">{{ page.title }}</h1>
  <time class="post-date" datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%B %-d, %Y" }}</time>

  <div class="post-body">
    {{ content }}
  </div>
</article>
