---
layout: default
---
<article>
  <header class="wrap page-head post-head">
    <p class="eyebrow"><a class="back" href="{{ '/blog/' | relative_url }}">← All posts</a></p>
    <h1 id="page-title">{{ page.title }}</h1>
    <time class="mono" datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%B %-d, %Y" }}</time>
  </header>

  <div class="wrap page-body">
    <div class="prose">
      {{ content }}
    </div>
  </div>
</article>
